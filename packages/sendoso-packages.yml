  finding: >-
    The org holds no Sendoso client library. Fifteen of the sixteen public repositories are
    ARCHIVED, and all fifteen are forks of other people's Ruby/infra projects (wicked_pdf,
    sassc-ruby, rack-cors, temporal-ruby, acts_as_paranoid, apollo-federation-ruby,
    odbc_adapter, omniauth-eloqua, omniauth-surveymonkey, rubocop-sendoso, charts,
    docker-compose, nuxt-prometheus-module, temporal, app-example). The single unarchived
    repository is `linear-release`, a TypeScript CLI for tracking releases in Linear
    (last pushed 2026-06-08) — internal tooling, unrelated to the API.
