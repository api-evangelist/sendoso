    source: https://developer.sendoso.com/rest-api/overview/faq
  - id: ratelimit-headers
    name: RateLimit header fields (RFC 9331 / draft-ietf-httpapi-ratelimit-headers)
    conforms: false
    evidence: >-
      Only a non-standard `X-Rate-Limit-Reset` on the Marketplace/SmartSend surface. No
      RateLimit, RateLimit-Policy, X-RateLimit-Limit/Remaining or Retry-After anywhere.
    source: rate-limits/sendoso-rate-limits.yml
  - id: rfc8594
    name: Sunset header (RFC 8594)
    conforms: false
    evidence: No Sunset or Deprecation headers, and no deprecation policy at all.
    source: lifecycle/sendoso-lifecycle.yml
  - id: pagination
    name: Consistent pagination
    conforms: false
    evidence: >-
      Three different schemes across one product (page/per_page on Core, cursor `after` on
