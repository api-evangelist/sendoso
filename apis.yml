name: Sendoso
description: >-
  Sendoso is a corporate gifting and direct mail platform that lets sales, marketing, customer
  success and people teams send physical gifts, branded swag, eGifts, direct mail and
  charitable donations at scale. The Sendoso Core API (v3) automates sending against
  pre-configured campaigns — physical gifts to a known address, physical gifts with recipient
  address collection, and eGifts delivered by email or as embeddable links — while the
  Marketplace and SmartSend APIs send from an open catalog and let Sendoso pick the gift from
  the recipient's interests. A SCIM 2.0 surface handles user provisioning, an embeddable iFrame
  puts the whole send flow inside a partner application, and Svix-signed webhooks report
  twenty-eight send lifecycle events. Sendoso also ships an OAuth-protected MCP server, an
  agent skill and an A2A agent card, and integrates with Salesforce, HubSpot, Outreach,
  SalesLoft, Marketo and other CRM and sales engagement tools.
