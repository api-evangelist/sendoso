x-provenance:
  checked: '2026-08-13'
  note: >-
    This profile was rebuilt from Sendoso's own published documentation at
    developer.sendoso.com. The five API entries it previously carried (Inventory, Recipients,
    Reports, Sends, Teams) and the OpenAPI documents behind them were an API Evangelist
    scaffold — wrong base path (/api/v2, which returns 404), wrong auth (X-Api-Key instead of
    OAuth 2.0), and not one real path. They and the eighteen artifacts derived from them are
    quarantined in _scaffold/ with a written record.
  openapi_provenance: >-
    Sendoso publishes no OpenAPI document. The three descriptions in openapi/ are generated by
    API Evangelist from Sendoso's reference pages; each carries
    info.x-generated-from: documentation and a per-operation externalDocs URL back to the
    source page.
  pointers_removed:
    - type: StatusPage
      url: https://status.sendoso.com/
      reason: >-
        Host does not answer over HTTP or HTTPS (probed 2026-08-13); the underlying Atlassian
        Statuspage at sendoso.statuspage.io reports INACTIVE.
    - type: TermsOfService
      url: https://sendoso.com/terms-of-service/
      reason: 404. Replaced with https://www.sendoso.com/terms.
    - type: PrivacyPolicy
      url: https://sendoso.com/privacy-policy/
      reason: 404. Replaced with https://www.sendoso.com/privacy.
    - type: PostmanWorkspace
      url: https://www.postman.com/kinlaneapi/sendoso/overview
      reason: >-
        Built from the scaffold collections and still serves invented /api/v2 requests. Needs
        rebuilding or unpublishing by hand before it is pointed at again.
    - types: [AgenticAccess, JSONSchema, JSONStructure, JSONLD, Examples]
      reason: >-
        All derived from the scaffold OpenAPI and describing paths and fields that do not
        exist. Quarantined in _scaffold/.
    - type: FinOps
      url: finops/sendoso-finops.yml
      reason: >-
        Same 2026-05-04 scaffold pass. Asserted a "Usage-Based, Monthly, USD" billing model
        for a provider that publishes no prices at all. Quarantined in _scaffold/finops/.
