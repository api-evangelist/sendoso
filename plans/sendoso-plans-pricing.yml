specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Sendoso
providerId: sendoso
created: '2026-05-04'
generated: '2026-08-13'
modified: '2026-08-13'
method: searched
source: https://www.sendoso.com/compare-plans
docs:
  - https://www.sendoso.com/compare-plans
description: >-
  Sendoso's four published plan tiers, read from its own plan comparison page. This file
  replaces a 2026-05-04 scaffold that invented prices and quotas. NO PRICE IS PUBLISHED for
  any tier — every call to action on the page is "Get Pricing & Promos", "Contact Us" or
  "Talk to sales", and the page itself says pricing is "Based on your size, goals, global
  presence". The quotas below are real and published; the prices genuinely do not exist in
  public.
plan_count: 4
pricing_published: false
currency: null
billing_period: null
public_signup: false
sales_gate: true
plans:
  - id: sendoso-starter
    name: Starter
    price: null
    price_published: false
    positioning: Start a sending program without the spreadsheets.
    included:
      licenses: 5
      sends_per_month: 100
      unlimited_sending: false
      sendoso_fulfillment_regions: 0
      platform_integrations: 1
      product_environments: 0
      campaign_studio_projects_per_year: 0
      account_team: Digital
      support: Global
    features:
      - Global eGifts + On Demand Marketplace
      - 1:1 or 1:Many sending
      - Standard recipient experience
      - Digital success and education
    api_access: null
    api_access_note: >-
      The comparison grid carries a "Sendoso API" row under Integrations, but the page markup
      does not expose which tiers the checkmark falls on. Not recorded rather than guessed.
    mcp_server: false
  - id: sendoso-core
    name: Core
    price: null
    price_published: false
    positioning: Use gifting and direct mail as a repeatable play for your team or department.
    included:
      licenses: 10
      sends_per_month: unlimited
      unlimited_sending: true
      sendoso_fulfillment_regions: 1
      platform_integrations: 2
      product_environments: 1
      campaign_studio_projects_per_year: 4
      account_team: Dedicated
    features:
      - Everything in Starter
      - Bulk sending
      - Event sending
      - Custom email domains
      - Merch by Sendoso
      - Unlimited recipient themes and templates
      - 'AI tools: SmartSend + SmartMessage'
      - MCP Server
      - SSO
    mcp_server: true
    mcp_note: >-
      "MCP Server" first appears at this tier. Sendoso's agent surface at
      https://app.sendoso.com/mcp is therefore a paid entitlement, not a universal one — see
      mcp/sendoso-mcp.yml.
  - id: sendoso-advanced
    name: Advanced
    price: null
    price_published: false
    positioning: Centralize gifting across multiple teams and departments globally.
    included:
      licenses: 50
      sends_per_month: unlimited
      unlimited_sending: true
      sendoso_fulfillment_regions: 2
      platform_integrations: unlimited
      product_environments: 1
      campaign_studio_projects_per_year: unlimited
      account_team: Dedicated
    features:
      - Everything in Core
      - Swag Storefront
      - Swag On Demand
      - Custom kitting instructions
      - 'AI tools: full SmartSuite'
      - 'AI Agent: Oso'
      - Meeting Scheduler
      - HRIS Hub
      - SSO
    mcp_server: true
  - id: sendoso-enterprise
    name: Enterprise
    price: null
    price_published: false
    positioning: >-
      Scale a bespoke gifting program globally with technical and strategic partners.
    included:
      licenses: custom
      sends_per_month: unlimited
      unlimited_sending: true
      sendoso_fulfillment_regions: all
      platform_integrations: unlimited
      product_environments: 2
      account_team: Dedicated
    features:
      - Everything in Advanced
      - Policy Center
      - Advanced IT controls
      - Advanced audit services
      - IP allow listing
      - Admin audit log
      - Anti-bribery controls
      - SCIM user management
      - Direct data connections
      - SSO
    mcp_server: true
    note: >-
      SCIM user management is an Enterprise-tier row on the comparison grid, which means the
      SCIM API documented at developer.sendoso.com/scim is gated to Enterprise contracts.
overage: null
overage_note: >-
  No overage rate is published. Starter's 100 sends/month is a hard included quota with no
  stated price for exceeding it; every other tier is "unlimited sending" (gift cost is
  separate from platform subscription and is not published either).
notes:
  - >-
    Gift and fulfillment cost is a separate spend from the platform subscription. Neither is
    priced publicly, and the API exposes account balance (`balance`, `team_balance` on
    GET /api/v3/me) without exposing what it cost to fill.
