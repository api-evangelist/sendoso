generated: '2026-08-13'
method: probed
source: https://app.sendoso.com/mcp
provider: Sendoso
providerId: sendoso
description: >-
  Sendoso ships TWO remote MCP servers, and they are different products. The production
  server at https://app.sendoso.com/mcp is an OAuth-protected agent surface over the Sendoso
  platform itself — it answers the MCP handshake with a full RFC 9728 / RFC 8414 metadata
  chain including dynamic client registration. The second, at
  https://developer.sendoso.com/mcp, is the Mintlify documentation-search server that ships
  with the docs site; it is anonymous and its tools only read documentation.
deployment:
  mode: remote
  endpoint: https://app.sendoso.com/mcp
  auth: oauth
  verified: probed
servers:
  - id: sendoso-platform-mcp
    name: Sendoso MCP Server
    endpoint: https://app.sendoso.com/mcp
    transport: streamable-http
    auth: oauth
    status: live
    first_party: true
    verified: probed
    x-evidence:
      fetched: '2026-08-13'
      method: POST tools/list with Accept application/json, text/event-stream
      http_status: 401
      www_authenticate: >-
        Bearer resource_metadata="https://app.sendoso.com/.well-known/oauth-protected-resource/mcp"
    tools_enumerated: false
    tools_note: >-
      tools/list is auth-gated. The live tool schemas need an authenticated introspection
      pass with an OAuth token; nothing is recorded here that was not returned by the server
      or published by Sendoso. Do not assume the tool list matches the REST surface.
    oauth:
      protected_resource_metadata: https://app.sendoso.com/.well-known/oauth-protected-resource/mcp
      authorization_server_metadata: https://app.sendoso.com/.well-known/oauth-authorization-server/mcp
      issuer: https://app.sendoso.com/mcp
      authorization_endpoint: https://app.sendoso.com/mcp/oauth/authorize
      token_endpoint: https://app.sendoso.com/mcp/oauth/token
      registration_endpoint: https://app.sendoso.com/mcp/oauth/register
      dynamic_client_registration: true
      jwks_uri: https://sendosoprod.auth0.com/.well-known/jwks.json
      grant_types_supported: [authorization_code, refresh_token]
      code_challenge_methods_supported: [S256]
      token_endpoint_auth_methods_supported: [none]
      scopes_supported: [openid, profile, email, offline_access]
      bearer_methods_supported: [header]
    packaging_note: >-
      Sendoso's own plan comparison lists "MCP Server" as a feature that starts at the Core
      tier — the agent surface is a paid entitlement, not a universal one. See
      plans/sendoso-plans-pricing.yml.
  - id: sendoso-docs-mcp
    name: Sendoso API Docs MCP
    endpoint: https://developer.sendoso.com/mcp
    transport: streamable-http
    auth: none
    status: live
    first_party: false
    first_party_note: >-
      Served from a Sendoso host but generated by Mintlify, the documentation platform. Its
      server card self-reports its canonical url as
      https://sendoso-39.main-kill-isr.mintlify.me/mcp.
    verified: probed
    x-evidence:
      fetched: '2026-08-13'
      method: POST tools/list
      http_status: 200
      content_type: text/event-stream
    server_card: mcp/sendoso-mcp-server-card.json
    tools_enumerated: true
    tools:
      - name: search_sendoso_api
        title: Search documentation
        description: >-
          Search across the Sendoso API knowledge base for documentation, code examples, API
          references and guides.
        input_schema:
          type: object
          required: [query]
          properties:
            query:
              type: string
        read_only: true
      - name: query_docs_filesystem_sendoso_api
        description: >-
          Read-only shell-like query (rg, grep, find, tree, ls, cat, head, tail, jq, ...)
          against a virtualized in-memory filesystem containing only the Sendoso
          documentation pages.
        input_schema:
          type: object
          required: [command]
          properties:
            command:
              type: string
        read_only: true
      - name: submit_feedback
        title: Submit documentation feedback
        input_schema:
          type: object
          required: [path, feedback]
          properties:
            path:
              type: string
            feedback:
              type: string
        read_only: false
